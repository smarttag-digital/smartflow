<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SmartFlow CRM</title>
    <meta name="description" content="SmartFlow CRM — gestão de leads, pipeline e financeiro para imobiliárias" />
    <meta name="author" content="SmartFlow" />

    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5a4ee8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartFlow" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SmartFlow CRM" />
    <meta property="og:description" content="CRM imobiliário SmartFlow — leads, pipeline e financeiro" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SmartFlow CRM" />
    <meta name="twitter:description" content="CRM imobiliário SmartFlow — leads, pipeline e financeiro" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("smartflow.theme");
          var mode = stored || "dark";
          var resolved = mode === "auto"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : mode;
          document.documentElement.classList.add(resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
